name: Generate PB Files from JSON

on:
  push:
    paths:
      - 'livery.json'
      - 'data/schema.proto'
  pull_request:
    paths:
      - 'livery.json'
      - 'data/schema.proto'
concurrency:
  group: "committers"
  cancel-in-progress: false

jobs:
  generate-pb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with sparse paths
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            livery.json
            data/package.json
            data/package-lock.json
            data/schema.proto
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: |
            data/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('data/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        working-directory: data
        run: npm ci

      - name: Convert JSON files to PB
        working-directory: data
        run: |
          mkdir -p data/proto
          node -e "
            const fs = require('fs');
            const path = require('path');
            const protobuf = require('protobufjs');
            const schemaPath = 'schema.proto';
            protobuf.load(schemaPath).then(root => {
              const rootDir = path.resolve(process.cwd(), '..');
              const LiveryObject = root.lookupType('LiveryObject');
              const jsonPath = path.join(rootDir, 'livery.json');
              const jsonData  = JSON.parse(fs.readFileSync(jsonPath, 'utf8'))
              const message = LiveryObject.create(jsonData);
              const buffer = LiveryObject.encode(message).finish();
              const outPath = path.join('data', 'proto', 'livery.pb');
              fs.writeFileSync(outPath, buffer);
              console.log('Generated', outPath);
            }).catch(err => { console.error(err); process.exit(1); });
          "
      - name: Commit and push generated PB files
        working-directory: data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add proto/*.pb
          if ! git diff --cached --quiet; then
            git commit -m "Generate PB files from JSON"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No PB files to commit."
          fi
